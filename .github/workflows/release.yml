name: Release

permissions: read-all

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string
      replace:
        description: Replace the package and release artifacts within Hex's correction window
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'inttegro/inttegro-sdk-elixir'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Install Hex and Rebar
        run: mix local.hex --force && mix local.rebar --force
      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs)"
          test "${RELEASE_TAG}" = "v${version}"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "$(git rev-parse HEAD)"
      - name: Run release checks and build the package
        shell: bash
        run: |
          set -euo pipefail
          mix deps.get
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test
          mix hex.audit
          mix hex.build
          mix docs
          mkdir -p artifacts
          cp inttegro-*.tar artifacts/
      - name: Attest the Hex package
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.tar
      - name: Record release provenance and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" artifacts/ATTESTATIONS.sigstore
          {
            echo "repository=https://github.com/${GITHUB_REPOSITORY}"
            echo "tag=${RELEASE_TAG}"
            echo "commit=$(git rev-parse HEAD)"
            echo "workflow=${GITHUB_WORKFLOW_REF}"
            echo "package=inttegro"
          } > artifacts/PROVENANCE.txt
          (cd artifacts && sha256sum ./*.tar ./ATTESTATIONS.sigstore ./PROVENANCE.txt > SHA256SUMS)
      - name: Create the draft GitHub release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --draft
          --generate-notes
          --title "Inttegro Elixir SDK ${GITHUB_REF_NAME}"
          --verify-tag
      - name: Publish package and documentation to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          REPLACE_RELEASE: ${{ inputs.replace || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REPLACE_RELEASE}" == "true" ]]; then
            mix hex.publish --yes --replace
          else
            mix hex.publish --yes
          fi
      - name: Publish GitHub release artifacts
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            gh release upload "${RELEASE_TAG}" artifacts/* --clobber
          else
            gh release edit "${RELEASE_TAG}" --draft=false
          fi
